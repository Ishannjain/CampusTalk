{% extends "accounts/layout.html" %}
{% block body %}
<div class="container fade-in-up" style="margin-top: 50px; margin-bottom: 80px;">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="glass-card p-5">
                <div class="text-center mb-5">
                    <div class="avatar-sm mx-auto mb-3" style="width: 70px; height: 70px; background: rgba(99, 102, 241, 0.1); font-size: 28px; color: #6366f1;">
                        <i class="fas fa-plus-circle"></i>
                    </div>
                    <h3 class="font-weight-bold text-dark">Create Community Post</h3>
                    <p class="text-secondary small">Share your thoughts with the community</p>
                </div>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="form-group mb-4">
                        <label class="small font-weight-bold text-secondary mb-2" style="text-transform: uppercase; letter-spacing: 1px;">Message</label>
                        {{ form.content }}
                    </div>

                    <div class="form-group mb-4">
                        <label class="small font-weight-bold text-secondary mb-2" style="text-transform: uppercase; letter-spacing: 1px;">Attachment</label>
                        
                        <div class="mb-3" style="display: none;">
                            <img src="" class="img-upload-preview rounded shadow-sm" style="max-width: 100%; max-height: 250px; object-fit: contain; border: 2px solid white;">
                        </div>

                        <div class="custom-file">
                            <input type="file" name="image" id="comm-post-image" class="custom-file-input">
                            <label class="custom-file-label" for="comm-post-image">Choose an image...</label>
                        </div>
                    </div>

                    <div class="glass-card p-3 mb-5 d-flex align-items-center" style="background: rgba(241, 245, 249, 0.5);">
                        <div class="flex-grow-1">
                            <h6 class="mb-0 font-weight-bold small">Post Anonymously</h6>
                            <p class="text-muted mb-0" style="font-size: 11px;">Your identity will be hidden from everyone</p>
                        </div>
                        <div class="custom-control custom-switch">
                            {{ form.is_anonymous }}
                            <label class="custom-control-label" for="{{ form.is_anonymous.id_for_label }}"></label>
                        </div>
                    </div>

                    <div class="d-flex flex-column gap-3">
                        <button type="submit" class="btn btn-primary btn-lg py-3" style="border-radius: 12px; font-weight: bold;">
                            Share with Community
                        </button>
                        <a href="{% url 'community_list' %}" class="btn btn-link text-secondary mt-2" style="text-decoration: none;">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
